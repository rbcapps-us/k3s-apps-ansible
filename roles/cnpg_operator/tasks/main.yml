- name: "CloudNativePG Kubernetes Operator installation or upgrade"
  run_once: true
  become: true
  become_user: '{{ kube_api_user }}'
  block:
    - name: "Install or update the CloudNativePG Kubernetes Operator"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          set +e
          kubectl diff --server-side -f {{ cnpg_operator_installer_manifest_uri | quote }}
          kubectl_diff_retval="$?"
          set -e

          if [ "$kubectl_diff_retval" -ne 0 ]; then
              # Exit code 1 from kubectl diff indicates differences were found.
              # Any other non-zero exit code indicates an unexpected error.
              if [ "$kubectl_diff_retval" -ne 1 ]; then
                  echo "kubectl diff failed with unexpected return code $kubectl_diff_retval" >&2
                  exit "$kubectl_diff_retval"
              fi
              kubectl apply --server-side -f {{ cnpg_operator_installer_manifest_uri | quote }}
              exit 99
          fi
      args:
        executable: /bin/bash
      register: cnpg_operator_apply_result
      changed_when: "cnpg_operator_apply_result.rc == 99"
      failed_when: "cnpg_operator_apply_result.rc not in [0, 99]"

    - name: "Wait for the CloudNativePG operator deployment to be ready"
      run_once: true
      become: true
      become_user: '{{ kube_api_user }}'
      ansible.builtin.shell:
        cmd: |
          set -e
          set -o pipefail

          kubectl -n cnpg-system wait deployment.apps/cnpg-controller-manager --for condition=Available=True --timeout=300s
      args:
        executable: /bin/bash
      changed_when: false
